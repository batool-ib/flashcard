<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud & Azure Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f5ff;
    --white: #ffffff;
    --border: #dce8ff;
    --text: #1a2540;
    --muted: #6b7fa8;
    --accent: #3b6ef8;
    --accent-light: #eff4ff;
    --green: #059669;
    --green-light: #ecfdf5;
    --red: #dc2626;
    --red-light: #fef2f2;
    --yellow: #d97706;
    --yellow-light: #fffbeb;
    --purple: #7c3aed;
    --purple-light: #f5f3ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }

  /* ── HEADER ── */
  .header {
    text-align: center;
    margin-bottom: 28px;
    width: 100%;
    max-width: 720px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .logo {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    color: var(--text);
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── FILTER TABS ── */
  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 20px;
    max-width: 720px;
    width: 100%;
  }

  .filter-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--white);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.18s;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── STATS BAR ── */
  .stats-bar {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 24px;
    max-width: 720px;
    width: 100%;
  }

  .stat {
    flex: 1;
    max-width: 140px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }

  .stat .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    display: block;
  }

  .stat .lbl { font-size: 11px; color: var(--muted); }
  .stat.s-known .num { color: var(--green); }
  .stat.s-review .num { color: var(--red); }
  .stat.s-total .num { color: var(--accent); }

  /* ── PROGRESS ── */
  .progress-wrap {
    width: 100%;
    max-width: 720px;
    margin-bottom: 28px;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 6px;
  }

  .progress-track {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--purple));
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* ── CARD SCENE ── */
  .card-scene {
    width: 100%;
    max-width: 680px;
    height: 340px;
    perspective: 1200px;
    cursor: pointer;
    margin-bottom: 24px;
    position: relative;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px;
    padding: 36px 40px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 40px rgba(59, 110, 248, 0.1), 0 2px 8px rgba(0,0,0,0.06);
  }

  /* FRONT */
  .card-front {
    background: var(--white);
    border: 2px solid var(--border);
    justify-content: space-between;
  }

  .card-front .card-tag {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
  }

  .tag-chip {
    font-size: 11px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  .tag-ch1 { background: #eff4ff; color: var(--accent); }
  .tag-ch2 { background: var(--purple-light); color: var(--purple); }
  .tag-easy { background: var(--green-light); color: var(--green); }
  .tag-medium { background: var(--yellow-light); color: var(--yellow); }
  .tag-hard { background: #fef2f2; color: var(--red); }

  .card-front .question {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.45;
    color: var(--text);
    flex: 1;
    display: flex;
    align-items: center;
  }

  .flip-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    align-self: flex-end;
  }

  .flip-hint svg { width: 14px; height: 14px; }

  /* BACK */
  .card-back {
    background: linear-gradient(135deg, #1a2f6b 0%, #2d4ca3 100%);
    transform: rotateY(180deg);
    border: none;
    justify-content: space-between;
  }

  .card-back .back-label {
    font-size: 11px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    color: rgba(255,255,255,0.5);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .card-back .answer {
    font-size: 16px;
    line-height: 1.65;
    color: #e8efff;
    flex: 1;
    overflow-y: auto;
  }

  .card-back .answer strong {
    color: #93c5fd;
    font-weight: 700;
  }

  .card-back .answer .highlight {
    background: rgba(255,255,255,0.1);
    border-left: 3px solid #60a5fa;
    padding: 8px 12px;
    border-radius: 0 6px 6px 0;
    margin: 10px 0;
    font-size: 14px;
  }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    max-width: 720px;
    width: 100%;
  }

  .btn {
    padding: 12px 28px;
    border-radius: 12px;
    border: none;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }

  .btn-know {
    background: var(--green);
    color: white;
    flex: 1;
    max-width: 180px;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(5,150,105,0.3);
  }

  .btn-review {
    background: var(--red);
    color: white;
    flex: 1;
    max-width: 180px;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(220,38,38,0.3);
  }

  .btn-skip {
    background: var(--white);
    color: var(--muted);
    border: 1.5px solid var(--border);
    padding: 12px 20px;
  }

  .btn-flip {
    background: var(--accent-light);
    color: var(--accent);
    border: 1.5px solid var(--border);
    padding: 12px 20px;
  }

  /* ── NAV DOTS ── */
  .nav-row {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
    max-width: 720px;
    width: 100%;
    margin-bottom: 24px;
  }

  .nav-arrow {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--white);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    color: var(--muted);
    transition: all 0.18s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .nav-arrow:hover { border-color: var(--accent); color: var(--accent); }
  .nav-arrow:disabled { opacity: 0.3; cursor: default; }

  .dots-wrap {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 500px;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: all 0.2s;
  }

  .dot.current { background: var(--accent); transform: scale(1.3); }
  .dot.known { background: var(--green); }
  .dot.review-mark { background: var(--red); }

  /* ── COMPLETION SCREEN ── */
  .completion {
    display: none;
    text-align: center;
    width: 100%;
    max-width: 680px;
    animation: fadeUp 0.5s ease;
  }

  .completion-card {
    background: var(--white);
    border: 2px solid var(--border);
    border-radius: 24px;
    padding: 56px 48px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }

  .completion-emoji { font-size: 72px; margin-bottom: 16px; }

  .completion h2 {
    font-size: 32px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
  }

  .completion-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 52px;
    font-weight: 600;
    color: var(--accent);
    margin: 24px 0 8px;
  }

  .completion-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  .result-pills {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .result-pill {
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
  }

  .pill-green { background: var(--green-light); color: var(--green); }
  .pill-red { background: var(--red-light); color: var(--red); }

  .btn-restart-full {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 36px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
    box-shadow: 0 4px 16px rgba(59,110,248,0.35);
    margin: 0 6px;
  }

  .btn-restart-full:hover { transform: translateY(-2px); }

  .btn-review-only {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 36px;
    background: var(--red-light);
    color: var(--red);
    border: 2px solid #fca5a5;
    border-radius: 12px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
    margin: 0 6px;
  }

  .btn-review-only:hover { transform: translateY(-2px); }

  /* KEYBOARD HINT */
  .keyboard-hints {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    max-width: 720px;
    width: 100%;
  }

  .kbd-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
  }

  .kbd {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    box-shadow: 0 1px 0 var(--border);
  }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes cardEnter {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .card-scene.entering { animation: cardEnter 0.3s ease; }

  @media (max-width: 600px) {
    .card-scene { height: 300px; }
    .card-face { padding: 24px; }
    .card-front .question { font-size: 17px; }
    .card-back .answer { font-size: 14px; }
    .btn { padding: 10px 18px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">☁️</div>
    <h1>Cloud & Azure Flashcards</h1>
  </div>
  <p class="subtitle">Module 01 + Module 02 (Slides 1–33) · <span id="deck-count">60</span> cards</p>
</div>

<!-- FILTER TABS -->
<div class="filter-bar">
  <button class="filter-btn active" onclick="setFilter('all')">All Cards</button>
  <button class="filter-btn" onclick="setFilter('ch1')">Ch1 · Cloud Concepts</button>
  <button class="filter-btn" onclick="setFilter('ch2')">Ch2 · Azure Services</button>
  <button class="filter-btn" onclick="setFilter('easy')">Easy</button>
  <button class="filter-btn" onclick="setFilter('medium')">Medium</button>
  <button class="filter-btn" onclick="setFilter('hard')">Hard</button>
  <button class="filter-btn" onclick="setFilter('review')">⚠ Review Again</button>
</div>

<!-- STATS BAR -->
<div class="stats-bar">
  <div class="stat s-known"><span class="num" id="stat-known">0</span><span class="lbl">Known ✓</span></div>
  <div class="stat s-review"><span class="num" id="stat-review">0</span><span class="lbl">Review ✗</span></div>
  <div class="stat s-total"><span class="num" id="stat-left">60</span><span class="lbl">Remaining</span></div>
</div>

<!-- PROGRESS -->
<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-text">Card 1 of 60</span>
    <span id="prog-pct">0%</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
</div>

<!-- FLASHCARD -->
<div class="card-scene" id="cardScene" onclick="flipCard()">
  <div class="card-inner" id="cardInner">
    <div class="card-face card-front" id="cardFront">
      <div class="card-tag" id="cardTags"></div>
      <div class="question" id="cardQuestion"></div>
      <div class="flip-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v-1a8 8 0 0 1 8-8 8 8 0 0 1 8 8v1"/><polyline points="16 12 20 16 24 12"/></svg>
        Click to reveal answer
      </div>
    </div>
    <div class="card-face card-back" id="cardBack">
      <div class="back-label">Answer</div>
      <div class="answer" id="cardAnswer"></div>
    </div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button class="btn btn-review" onclick="markCard('review')" id="btnReview">✗ Review Again</button>
  <button class="btn btn-flip" onclick="flipCard()">↻ Flip</button>
  <button class="btn btn-skip" onclick="nextCard()">Skip →</button>
  <button class="btn btn-know" onclick="markCard('known')" id="btnKnow">✓ Got It!</button>
</div>

<!-- NAV -->
<div class="nav-row">
  <button class="nav-arrow" id="navPrev" onclick="prevCard()">‹</button>
  <div class="dots-wrap" id="dotsWrap"></div>
  <button class="nav-arrow" id="navNext" onclick="nextCard()">›</button>
</div>

<!-- KEYBOARD HINTS -->
<div class="keyboard-hints">
  <div class="kbd-hint"><span class="kbd">Space</span> Flip</div>
  <div class="kbd-hint"><span class="kbd">→</span> Next</div>
  <div class="kbd-hint"><span class="kbd">←</span> Prev</div>
  <div class="kbd-hint"><span class="kbd">K</span> Know it</div>
  <div class="kbd-hint"><span class="kbd">R</span> Review again</div>
</div>

<!-- COMPLETION SCREEN -->
<div class="completion" id="completionScreen">
  <div class="completion-card">
    <div class="completion-emoji" id="compEmoji">🎉</div>
    <h2 id="compTitle">Deck Complete!</h2>
    <div class="completion-score" id="compScore">0%</div>
    <div class="completion-sub" id="compSub"></div>
    <div class="result-pills" id="compPills"></div>
    <div>
      <button class="btn-restart-full" onclick="restartAll()">🔄 Restart All</button>
      <button class="btn-review-only" id="btnReviewOnly" onclick="restartReview()">⚠ Study Review Cards</button>
    </div>
  </div>
</div>

<script>
const ALL_CARDS = [
  // ─────────────── CHAPTER 1 ───────────────
  {
    id: 1, chapter: 'ch1', level: 'easy',
    q: "What is the core principle of cloud utility pricing?",
    a: "<strong>Cloud services don't need to be cheaper to be economic</strong> — it depends on demand.\n\n<div class='highlight'>Example: Renting a car at $45/day is better than owning one ($10/day) if you only need it for 2 days on a trip.</div>\n\nKey insight: When demand is <strong>spiky</strong>, renting during peaks is far more economical than provisioning for peak capacity all the time."
  },
  {
    id: 2, chapter: 'ch1', level: 'easy',
    q: "What is the KEY factor that determines whether cloud (renting) is better than on-premises (owning)?",
    a: "<strong>The ratio of Peak Demand to Average Demand</strong>\n\n<div class='highlight'>High peak-to-average ratio → Cloud wins. Flat demand → On-premises may be cheaper.</div>\n\nAlso consider: network cost (fixed + usage), interoperability overhead, reliability, and accessibility."
  },
  {
    id: 3, chapter: 'ch1', level: 'medium',
    q: "What is the 'Slashdot Effect' and why is it relevant to cloud computing?",
    a: "The <strong>Slashdot Effect</strong> is a sudden, massive spike in web traffic when a story or link goes viral — an 'Internet flash flood.'\n\n<div class='highlight'>It's an example of highly spiky demand: traffic can go from near-zero to enormous in minutes.</div>\n\nCloud elasticity allows you to scale up instantly during such spikes and scale back down after."
  },
  {
    id: 4, chapter: 'ch1', level: 'easy',
    q: "Name the 3 main Cloud Delivery Models and give an example of each.",
    a: "<strong>1. IaaS</strong> — Infrastructure as a Service\n→ Example: Amazon EC2, S3 (rent raw compute/storage)\n\n<strong>2. PaaS</strong> — Platform as a Service\n→ Example: Google App Engine (deploy apps without managing infra)\n\n<strong>3. SaaS</strong> — Software as a Service\n→ Example: SalesForce.com (use apps over the network)"
  },
  {
    id: 5, chapter: 'ch1', level: 'medium',
    q: "Define Big Data using the 4 Vs from the material.",
    a: "<strong>Big Data</strong> represents information assets characterized by:\n\n• <strong>Volume</strong> — enormous quantities of data\n• <strong>Velocity</strong> — high speed of data generation/processing\n• <strong>Variety</strong> — many types and formats\n\n<div class='highlight'>...requiring specific technology and analytical methods for transformation into Value (the 4th V).</div>"
  },
  {
    id: 6, chapter: 'ch1', level: 'medium',
    q: "Why do users buy Big Data services from the cloud?",
    a: "<strong>To share the overhead</strong> of maintaining expensive cyber infrastructure.\n\n<div class='highlight'>Petabyte-scale data is too large to transmit economically over the internet. The computation is data-intensive — lots of disks, networks, and CPUs.</div>\n\nCloud Big Data services provide: easy-to-write programs, fast turnaround, tools like MapReduce, Hadoop, PIG, HDFS, HBase."
  },
  {
    id: 7, chapter: 'ch1', level: 'easy',
    q: "What are the 3 Cloud Models? Give one unique characteristic of each.",
    a: "<strong>Public Cloud</strong>\n→ Owned by provider; serves multiple orgs; no CapEx to scale up\n\n<strong>Private Cloud</strong>\n→ Organization's own datacenter; does NOT allow outside access; requires hardware purchase\n\n<strong>Hybrid Cloud</strong>\n→ Combines both; most flexibility; org controls where apps run"
  },
  {
    id: 8, chapter: 'ch1', level: 'easy',
    q: "What is CapEx vs OpEx in cloud computing?",
    a: "<strong>CapEx (Capital Expenditure)</strong>\n→ Up-front spending on physical infrastructure\n→ Value reduces over time (depreciation)\n\n<strong>OpEx (Operational Expenditure)</strong>\n→ Spend on products/services as needed\n→ Pay-as-you-go, billed immediately\n\n<div class='highlight'>Cloud enables the shift from CapEx to OpEx — no upfront hardware investment.</div>"
  },
  {
    id: 9, chapter: 'ch1', level: 'medium',
    q: "What is the Consumption-Based Model in cloud?",
    a: "Cloud providers operate on a <strong>consumption-based model</strong>:\n\n• End users only pay for <strong>resources they actually use</strong>\n• Better cost prediction\n• Prices for individual resources are clearly provided\n• <strong>Billing is based on actual usage</strong>, not estimates\n\n<div class='highlight'>Whatever you use is what you pay for — like a pay-per-use utility bill.</div>"
  },
  {
    id: 10, chapter: 'ch1', level: 'medium',
    q: "List all 8 Cloud Benefits shown in the material.",
    a: "The Cloud Benefits slide shows:\n\n1. <strong>High Availability</strong>\n2. <strong>Elasticity</strong>\n3. <strong>Scalability</strong>\n4. <strong>Reliability</strong>\n5. <strong>Predictability</strong>\n6. <strong>Security</strong>\n7. <strong>Governance</strong>\n8. <strong>Manageability</strong>\n\n<div class='highlight'>The objective domain also adds: Agility and Disaster Recovery.</div>"
  },
  {
    id: 11, chapter: 'ch1', level: 'medium',
    q: "What does IaaS provide and who is responsible for what?",
    a: "<strong>IaaS</strong> = Build pay-as-you-go IT infrastructure by renting:\n• Servers, Virtual Machines\n• Storage\n• Networks\n• Operating Systems\n\n<div class='highlight'>You configure and manage the hardware for your application — the MOST flexible cloud service.</div>\n\nProvider manages: physical datacenter, network, hypervisor\nYou manage: OS, runtime, apps, data"
  },
  {
    id: 12, chapter: 'ch1', level: 'medium',
    q: "What does PaaS provide and who manages what?",

];

// ── STATE ──
let deck = [...ALL_CARDS];
let currentIndex = 0;
let isFlipped = false;
let cardStatus = {}; // id → 'known' | 'review' | null
let activeFilter = 'all';

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  if (f === 'all') deck = [...ALL_CARDS];
  else if (f === 'ch1') deck = ALL_CARDS.filter(c => c.chapter === 'ch1');
  else if (f === 'ch2') deck = ALL_CARDS.filter(c => c.chapter === 'ch2');
  else if (f === 'easy') deck = ALL_CARDS.filter(c => c.level === 'easy');
  else if (f === 'medium') deck = ALL_CARDS.filter(c => c.level === 'medium');
  else if (f === 'hard') deck = ALL_CARDS.filter(c => c.level === 'hard');
  else if (f === 'review') {
    deck = ALL_CARDS.filter(c => cardStatus[c.id] === 'review');
    if (deck.length === 0) {
      alert('No review cards yet! Mark cards as "Review Again" first.');
      setFilter('all'); return;
    }
  }

  currentIndex = 0;
  document.getElementById('deck-count').textContent = deck.length;
  document.getElementById('completionScreen').style.display = 'none';
  document.getElementById('cardScene').style.display = 'block';
  document.querySelector('.controls').style.display = 'flex';
  document.querySelector('.nav-row').style.display = 'flex';
  document.querySelector('.keyboard-hints').style.display = 'flex';
  renderCard();
  renderDots();
  updateStats();
}

function renderCard() {
  if (deck.length === 0) return;
  const card = deck[currentIndex];
  isFlipped = false;
  document.getElementById('cardInner').classList.remove('flipped');

  // Tags
  const chLabel = card.chapter === 'ch1' ? 'Ch1' : 'Ch2';
  const chClass = card.chapter === 'ch1' ? 'tag-ch1' : 'tag-ch2';
  const lvlClass = `tag-${card.level}`;
  document.getElementById('cardTags').innerHTML = `
    <span class="tag-chip ${chClass}">${chLabel}</span>
    <span class="tag-chip ${lvlClass}">${card.level}</span>
    ${cardStatus[card.id] ? `<span class="tag-chip" style="background:${cardStatus[card.id]==='known'?'#ecfdf5':'#fef2f2'};color:${cardStatus[card.id]==='known'?'#059669':'#dc2626'}">${cardStatus[card.id]==='known'?'✓ Known':'⚠ Review'}</span>` : ''}
  `;
  document.getElementById('cardQuestion').textContent = card.q;
  document.getElementById('cardAnswer').innerHTML = card.a;

  // Progress
  const pct = Math.round(((currentIndex + 1) / deck.length) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-text').textContent = `Card ${currentIndex + 1} of ${deck.length}`;
  document.getElementById('prog-pct').textContent = pct + '%';

  // Nav arrows
  document.getElementById('navPrev').disabled = currentIndex === 0;
  document.getElementById('navNext').disabled = currentIndex === deck.length - 1;

  // Dots
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.remove('current', 'known', 'review-mark');
    const cid = deck[i]?.id;
    if (i === currentIndex) d.classList.add('current');
    else if (cardStatus[cid] === 'known') d.classList.add('known');
    else if (cardStatus[cid] === 'review') d.classList.add('review-mark');
  });

  // Animate
  document.getElementById('cardScene').classList.remove('entering');
  void document.getElementById('cardScene').offsetWidth;
  document.getElementById('cardScene').classList.add('entering');
}

function renderDots() {
  const wrap = document.getElementById('dotsWrap');
  wrap.innerHTML = deck.map((c, i) => `<div class="dot${i===currentIndex?' current':''}" onclick="jumpTo(${i})"></div>`).join('');
}

function jumpTo(i) {
  currentIndex = i;
  renderCard();
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('cardInner').classList.toggle('flipped', isFlipped);
}

function nextCard() {
  if (currentIndex < deck.length - 1) {
    currentIndex++;
    renderCard();
  } else {
    showCompletion();
  }
}

function prevCard() {
  if (currentIndex > 0) {
    currentIndex--;
    renderCard();
  }
}

function markCard(status) {
  const card = deck[currentIndex];
  cardStatus[card.id] = status;
  updateStats();
  // Brief visual feedback then advance
  const btn = status === 'known' ? document.getElementById('btnKnow') : document.getElementById('btnReview');
  btn.style.opacity = '0.5';
  setTimeout(() => { btn.style.opacity = '1'; }, 200);
  setTimeout(() => nextCard(), 300);
}

function updateStats() {
  const known = Object.values(cardStatus).filter(v => v === 'known').length;
  const review = Object.values(cardStatus).filter(v => v === 'review').length;
  document.getElementById('stat-known').textContent = known;
  document.getElementById('stat-review').textContent = review;
  document.getElementById('stat-left').textContent = ALL_CARDS.length - known - review;
}

function showCompletion() {
  document.getElementById('cardScene').style.display = 'none';
  document.querySelector('.controls').style.display = 'none';
  document.querySelector('.nav-row').style.display = 'none';
  document.querySelector('.keyboard-hints').style.display = 'none';

  const total = deck.length;
  const known = deck.filter(c => cardStatus[c.id] === 'known').length;
  const review = deck.filter(c => cardStatus[c.id] === 'review').length;
  const pct = Math.round((known / total) * 100);

  let emoji = '🎉', title = 'Deck Complete!';
  if (pct >= 80) { emoji = '🏆'; title = 'Excellent Mastery!'; }
  else if (pct >= 60) { emoji = '📚'; title = 'Good Progress!'; }
  else { emoji = '💪'; title = 'Keep Studying!'; }

  document.getElementById('compEmoji').textContent = emoji;
  document.getElementById('compTitle').textContent = title;
  document.getElementById('compScore').textContent = pct + '%';
  document.getElementById('compSub').textContent = `${known} mastered · ${review} need review · ${total - known - review} skipped`;
  document.getElementById('compPills').innerHTML = `
    <span class="result-pill pill-green">✓ Known: ${known}</span>
    <span class="result-pill pill-red">⚠ Review: ${review}</span>
  `;

  const reviewBtn = document.getElementById('btnReviewOnly');
  reviewBtn.style.display = review > 0 ? 'inline-flex' : 'none';

  const comp = document.getElementById('completionScreen');
  comp.style.display = 'block';
}

function restartAll() {
  cardStatus = {};
  deck = activeFilter === 'all' ? [...ALL_CARDS] : deck;
  currentIndex = 0;
  document.getElementById('completionScreen').style.display = 'none';
  document.getElementById('cardScene').style.display = 'block';
  document.querySelector('.controls').style.display = 'flex';
  document.querySelector('.nav-row').style.display = 'flex';
  document.querySelector('.keyboard-hints').style.display = 'flex';
  updateStats();
  renderCard();
  renderDots();
}

function restartReview() {
  deck = ALL_CARDS.filter(c => cardStatus[c.id] === 'review');
  currentIndex = 0;
  document.getElementById('completionScreen').style.display = 'none';
  document.getElementById('cardScene').style.display = 'block';
  document.querySelector('.controls').style.display = 'flex';
  document.querySelector('.nav-row').style.display = 'flex';
  document.querySelector('.keyboard-hints').style.display = 'flex';
  renderCard();
  renderDots();
}

// Keyboard controls
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  else if (e.key === 'ArrowRight') nextCard();
  else if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === 'k' || e.key === 'K') markCard('known');
  else if (e.key === 'r' || e.key === 'R') markCard('review');
});

// INIT
renderCard();
renderDots();
</script>
</body>
</html>
